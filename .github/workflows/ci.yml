name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is set by the dev toolchain, not by the package: @changesets/cli
        # 3 needs Node ^22.11 || ^24 || >=26, and vitest 4 needs ^20 || ^22 ||
        # >=24. The published bundle targets es2022 and only needs Intl and
        # btoa/atob, so it still runs on the Node >=18 declared in engines.
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run test

      - run: pnpm run build

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage
          retention-days: 14
